<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita Médica</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: var(--primary); margin-bottom: 10px;">Consultorio Médico Digital</h1>
        <p style="text-align: center; color: var(--muted); margin-bottom: 30px;">Agende su cita en línea de forma rápida y sencilla.</p>

        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <form id="form-agendar" onsubmit="agendarCita(event)">
                
                <label>Nombre(s) del Paciente</label>
                <input type="text" id="paciente-nombre" required placeholder="Ej. Juan" style="text-transform: uppercase;">
                <div style="display: flex; gap: 10px;">
                    <div style="flex:1;">
                        <label>Primer Apellido</label>
                        <input type="text" id="paciente-ap1" required placeholder="Ej. Pérez" style="text-transform: uppercase;">
                    </div>
                    <div style="flex:1;">
                        <label>Segundo Apellido</label>
                        <input type="text" id="paciente-ap2" placeholder="Opcional" style="text-transform: uppercase;">
                    </div>
                </div>

                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 160px;">
                        <label>Fecha de Nacimiento</label>
                        <input type="date" id="paciente-nacimiento" required>
                    </div>
                    <div style="flex: 1; min-width: 160px;">
                        <label>Sexo</label>
                        <select id="paciente-sexo" required>
                            <option value="">Seleccione...</option>
                            <option value="MASCULINO">MASCULINO</option>
                            <option value="FEMENINO">FEMENINO</option>
                        </select>
                    </div>
                </div>

                <label>Teléfono Celular (10 dígitos)</label>
                <input type="tel" id="paciente-telefono" required placeholder="Ej. 5551234567" pattern="[0-9]{10}">
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 160px;">
                        <label>Fecha de la cita</label>
                        <input type="date" id="paciente-fecha" required onchange="validarFecha(this.value)">
                        <span id="error-fecha" style="color: var(--danger); font-size: 11px; display: none;">Cerrado fines de semana</span>
                    </div>
                    <div style="flex: 1; min-width: 160px;">
                        <label>Hora</label>
                        <select id="paciente-hora" required disabled>
                            <option value="">Seleccione una fecha primero</option>
                        </select>
                    </div>
                </div>

                <label>Motivo de la consulta</label>
                <input type="text" id="paciente-motivo" required placeholder="Breve descripción de sus síntomas" style="text-transform: uppercase;">

                <button type="submit" class="btn-primary" style="margin-top: 25px;">Confirmar Cita</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="app-public.js"></script>
</body>
</html>
